<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 替换UI组件：Tailwind + Font Awesome，移除w3.css -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- 原有业务样式和第三方库，保持不变 -->
    <link rel="stylesheet" type="text/css" href="lib/joint.css" />
    <link href="lib/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="style.css" />

    <!-- 原有JS依赖，顺序不能改动 -->
    <script src="lib/jquery.min.js"></script>
    <script src="lib/lodash.min.js"></script>
    <script src="lib/backbone.js"></script>
    <script src="lib/graphlib.min.js"></script>
    <script src="lib/dagre.min.js"></script>
    <script src="lib/joint.js"></script>
    <script src="lib/select2.min.js"></script>
    <script src="LogicParser.js"></script>

    <!-- Tailwind自定义主题（配色） -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        success: '#10b981',
                        warning: '#f59e0b',
                        info: '#06b6d4',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .panel-card {
                @apply bg-white rounded-lg shadow p-3 border border-gray-200;
            }
            .btn-primary {
                @apply bg-primary text-white px-3 py-2 rounded hover:bg-primary/80 transition-all flex items-center gap-1;
            }
            .btn-success {
                @apply bg-success text-white px-3 py-2 rounded hover:bg-success/80 transition-all flex items-center gap-1;
            }
            .btn-warning {
                @apply bg-warning text-white px-3 py-2 rounded hover:bg-warning/80 transition-all flex items-center gap-1;
            }
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="joint-app flex flex-col h-screen">
        <!-- 顶部头部区域 -->
        <div class="app-header panel-card m-2">
            <div class="flex flex-wrap gap-4">
                <!-- 左侧：逆波兰表达式输入区、文件操作 -->
                <div class="flex-1 min-w-[400px]">
                    <div class="flex flex-wrap gap-2 mb-3">
                        <label class="btn-success relative overflow-hidden">
                            <i class="fa fa-upload"></i>载入文本
                            <input type="file" id="fileToLoad" class="absolute inset-0 opacity-0 cursor-pointer">
                        </label>
                        <button class="btn-primary" onclick="app.saveTextAsFile()">
                            <i class="fa fa-download"></i>保存文本
                        </button>
                        <input class="border rounded px-2 py-1 flex-1 min-w-[140px]" id="inputFileNameToSaveAs" value="默认保存名称" placeholder="保存文件名">
                    </div>
                    <textarea id="ReversePol" class="w-full border rounded p-2 h-24 mb-3" placeholder="在此输入逆波兰逻辑表达式"></textarea>
                    <button class="btn-warning w-full" onclick="app.parseLogic()">
                        <i class="fa fa-cogs"></i>解析文本
                    </button>
                </div>

                <!-- 右侧：模型JSON，文本转图 / 图转图 -->
                <div class="flex-1 min-w-[400px]">
                    <textarea id="myModel" class="w-full border rounded p-2 h-24 mb-3">
{
    nodeArray: [],
    linkArray: []
}
                    </textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="LoadButton" class="btn-success w-full justify-center" onclick="app.load()">
                            <i class="fa fa-refresh"></i>文本转图
                        </button>
                        <button id="SaveButton" class="btn-primary w-full justify-center" onclick="app.save()">
                            <i class="fa fa-save"></i>图转文本
                        </button>
                    </div>
                </div>
            </div>
            <!-- 小地图 -->
            <div class="mini-map absolute top-4 right-4 w-40 h-28 bg-white border rounded shadow">
                <div id="mini-paper" class="w-full h-full"></div>
                <div id="mini-view">
                    <div id="mini-resize"></div>
                </div>
            </div>
        </div>

        <!-- 主体区域：画布 + 右侧面板 -->
        <div class="app-body flex flex-1 gap-2 px-2 overflow-hidden">
            <div class="left-container w-40"></div>
            <!-- JointJS绘图画布 -->
            <div class="main-container flex-1 panel-card overflow-hidden">
                <div id="paper-container" class="w-full h-full">
                    <div id="paper" class="w-full h-full" style="cursor:grab"></div>
                </div>
            </div>

            <!-- 侧边编辑面板 -->
            <div class="right-container w-72 panel-card overflow-auto">
                <div class="mb-3">
                    <label class="block text-gray-700 mb-1">元素名称：</label>
                    <input class="w-full border rounded p-2" type="text" id="ERName" />
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 mb-1">元素备注：</label>
                    <textarea class="w-full border rounded p-2 h-20" id="ERMemo"></textarea>
                </div>
                <button id="ERSetName" class="btn-warning w-full justify-center mb-4" onclick="app.ChangeName()">
                    <i class="fa fa-pencil"></i>保存修改
                </button>

                <!-- 使用说明 -->
                <div class="text-sm text-gray-700 bg-amber-50 p-3 rounded border border-amber-200">
                    <p class="font-semibold mb-2">使用说明</p>
                    <p class="mb-1">在“解析文本”上方文本框输入<span class="font-mono">逆波兰逻辑表达式</span>。</p>
                    <p class="mb-1">支持5种逻辑操作符：</p>
                    <ul class="list-disc pl-5 mb-2">
                        <li><code>.</code>：<code>a b .</code> = a 与 b</li>
                        <li><code>&lt;</code>：<code>a &lt;</code> = a 逻辑非</li>
                        <li><code>,</code>：<code>a b ,</code> = a 或 b</li>
                        <li><code>=</code>：<code>a b =</code> = a,b等价/同或</li>
                        <li><code>&gt;</code>：<code>a b ></code> = a推出b</li>
                    </ul>
                    <p class="mb-1">示例：</p>
                    <ul class="list-disc pl-5">
                        <li><code>a b . fe ></code>：a与b 推出 fe</li>
                        <li><code>a b . fe ge > =</code>：a与b等价于 fe推出ge</li>
                    </ul>
                    <p class="mt-2">输入后点【解析文本】生成JSON，再点【文本转图】渲染图形。</p>
                </div>
            </div>

            <!-- 伸缩按钮 -->
            <div id="app-resize">
                <div class="absolute left-[-35px] top-1/2 -translate-y-1/2 w-[30px] h-[30px] bg-[url(assets/box-arrow-in-right.svg)] bg-contain cursor-pointer" onclick="app.ResizeBlock()"></div>
            </div>
        </div>

        <!-- 底部状态栏 -->
        <div class="bottom-container panel-card m-2 py-2">
            <p id="status" class="text-gray-700">Diagram Model loaded from Json Format.</p>
        </div>
    </div>

    <!-- 原有视图JS，位置不动 -->
    <script src="ViewGen.js"></script>
</body>
</html>
